<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>flower styles 🌼🌷🌷</title>
  <style>
    h1 {
      color: hotpink;
      text-transform: lowercase;
    }
    p {
      font-size: 18px;
      color: seagreen;
    }
    .rose {
      color: crimson;
      font-weight: bold;
    }
    .sunflower {
      color: goldenrod;
      font-style: italic;
    }
    .tulip {
      color: purple;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>flowers are magical 🌸</h1>
  <p class="rose">roses mean love 🌹💌</p>
  <p class="sunflower">sunflowers follow the sun ☀️🌻</p>
  <p class="tulip">tulips bloom in spring 🌷✨</p>
</body>
</html>
