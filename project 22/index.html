<!DOCTYPE html>
<html>
<body>

<script>

/////SUM OF ARGUMENTS
function findSum() {
  var sum = 0;
  for (var i = 0; i < arguments.length; i++) {
    sum = sum + arguments[i];
  }
  return sum;
}

document.write("Sum = " + findSum(4, 5, 6) + "<br><br>");

////TRIGONOMETRIC FUNCTIONS
var sinValue = Math.sin(30);
document.write("Sin value = " + sinValue + "<br>");

var cosValue = Math.cos(30);
document.write("Cos value = " + cosValue + "<br>");

var tanValue = Math.tan(30);
document.write("Tan value = " + tanValue + "<br>");

</script>

</body>
</html>
