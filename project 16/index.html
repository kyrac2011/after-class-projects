<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>coquette slider 🎀💖</title>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body style="text-align:center; background-color:#ffe6f0;">

    <div class="container mt-4">
<h2>cutiee 🎀✨</h2>
<!-- carousel -->
<div id="coquetteCarousel" class="carousel slide" data-ride="carousel">   
<!-- slides -->
 <div class="carousel-inner">
  <div class="carousel-item active">
 <img src="cutie.jpeg" alt="slide 1" class="d-block w-100">
  <div class="carousel-caption">
<h5>heyyy queen 💖🎀</h5>
</div>
</div>
 <div class="carousel-item">
<img src="cute.jpeg" alt="slide 2" class="d-block w-100">
 <div class="carousel-caption">
<h5>welcome to my page! ✨💗</h5>
</div>
</div>
<div class="carousel-item">
<img src="cute.png" alt="slide 3" class="d-block w-100">
 <div class="carousel-caption">
<h5>let's have fun 🎀💞</h5>
 </div>
 </div>
 </div>

<!-- controls -->
            <a class="carousel-control-prev" href="#coquetteCarousel" data-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </a>
            <a class="carousel-control-next" href="#coquetteCarousel" data-slide="next">
                <span class="carousel-control-next-icon"></span>
            </a>
        </div>
    </div>

    <!-- bootstrap -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
