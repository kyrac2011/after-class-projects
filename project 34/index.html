<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank App</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        text-align: center;
        padding-top: 50px;
    }

    h1 {
        margin-bottom: 30px;
    }

    input {
        padding: 10px;
        width: 200px;
        border-radius: 5px;
        border: 1px solid #ccc;
        margin-left: 10px;
    }

    button {
        margin: 20px;
        padding: 12px 30px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background-color: #2c2f33;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: #23272a;
    }

    .balance-box {
        margin-top: 30px;
        padding: 20px;
        border-radius: 10px;
        background-color: #dfe6f0;
        display: inline-block;
        font-size: 18px;
    }
</style>
</head>

<body>

<h1>Bank App</h1>

<label>Enter Transaction Amount</label>
<input type="number" id="amount" placeholder="Enter amount">

<br>

<button onclick="credit()">Credit</button>
<button onclick="debit()">Debit</button>

<div class="balance-box">
    Your Account Balance is : Rs.<span id="balance">0</span>
</div>

<script>
    let balance = 0;

    function credit() {
        let amount = parseFloat(document.getElementById("amount").value);

        if (isNaN(amount) || amount <= 0) {
            alert("Enter a valid amount");
            return;
        }

        balance += amount;
        updateBalance();
    }

    function debit() {
        let amount = parseFloat(document.getElementById("amount").value);

        if (isNaN(amount) || amount <= 0) {
            alert("Enter a valid amount");
            return;
        }

        if (amount > balance) {
            alert("Insufficient balance");
            return;
        }

        balance -= amount;
        updateBalance();
    }

    function updateBalance() {
        document.getElementById("balance").innerText = balance;
        document.getElementById("amount").value = "";
    }
</script>

</body>
</html>
