<!DOCTYPE html>
<html>
<head>
<title>Bank App</title>

<style>
    body {
        font-family: Arial;
        text-align: center;
        margin-top: 50px;
    }

    input {
        padding: 10px;
        width: 200px;
    }

    button {
        padding: 10px 20px;
        margin: 10px;
    }
</style>
</head>

<body>

<h1>Bank App</h1>

<p>Enter Transaction Amount</p>
<input type="number" id="amount">

<br>

<button onclick="credit()">Credit</button>
<button onclick="debit()">Debit</button>

<p>Your Account Balance is : Rs.<span id="balance">0</span></p>

<script>
    let balance = 0;

    function credit() {
        let amount = document.getElementById("amount").value;
        amount = Number(amount);  

        balance = balance + amount;

        document.getElementById("balance").innerText = balance;
    }

    function debit() {
        let amount = document.getElementById("amount").value;
        amount = Number(amount);

        balance = balance - amount;

        document.getElementById("balance").innerText = balance;
    }
</script>

</body>
</html>
