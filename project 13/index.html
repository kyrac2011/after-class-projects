<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unequal grids 🐾</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<style>
.col {
  text-align: center;
  border: 1px solid black;
  padding: 20px;
}
</style>
</head>
<body>

<div class="container-fluid">
<h1>wildlife 🐾</h1>
<p>resize the browser window to see the animal grid 🐘✨</p>

<!-- large grid -->
<div class="row">
  <div class="col-lg-4" style="background-color: #ffe4b5;">lion 🦁</div>
  <div class="col-lg-8" style="background-color: #ffd700;">elephant 🐘</div>
</div>

<!-- unequal grid example -->
<div class="row" style="margin-top: 10px;">
  <div class="col-md-2" style="background-color: #faf0e6;">penguin 🐧</div>
  <div class="col-md-5" style="background-color: #ffdead;">giraffe 🦒</div>
  <div class="col-md-5" style="background-color: #ffe4e1;">tiger 🐯</div>
</div>

<div class="row" style="margin-top: 10px;">
  <div class="col-md-3" style="background-color: #f0e68c;">zebra 🦓</div>
  <div class="col-md-9" style="background-color: #ffdab9;">monkey 🐒</div>
</div>

<!-- extra small example -->
<div class="row" style="background-color: #e0ffff; margin-top: 10px;">
  <div class="col-6">fox 🦊</div>
  <div class="col-6">owl 🦉</div>
</div>

</div>
</body>
</html>
