<!DOCTYPE html>
<html>
<head>
<style>

/* background image on body */
body {
  background-color: #F8E9B9;
  background-repeat: no-repeat;
  background-position: top right;
  background-attachment: fixed;
  text-align: center;
  font-family: Arial, sans-serif;
}


div {
  height: 500px;
  width: 90%;
  max-width: 500px;
  background-color: #D6ECF5; 
  background-image: radial-gradient(circle, #D6ECF5, #A9D9EC, #7A9BC1, #F8E9B9, #FDF8E4);
  justify-content: center;
  align-items: center;
  font-size: 40px;
  font-weight: bold;
  color: #ffffff;
}


@keyframes example {
  0% {background-color: #F8E9B9;}   
  25% {background-color: #D6ECF5;} 
  50% {background-color: #A9D9EC;}  
  100% {background-color: #7A9BC1;} 
}


span {
  display: inline-block;
  width: 300px;
  height: 300px;
  background-color: #FDF8E4; 
  animation-name: example;
  animation-duration: 4s;
  font-size: 100px;
  line-height: 300px;
}

</style>
</head>
<body>

<div>
  heyy i'm kyra!!
</div>

<span>🤍</span>

<p style="font-size:30px; color:#fbbf76;">
  this is my cascading effect webpage     
</p>

</body>
</html>
