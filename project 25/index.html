<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Random Numbers Using a Loop</h2>
<p id="random"></p>

<script>
var text = "";
var i = 0;

while (i < 10) {
  var randomNumber = Math.floor(Math.random() * 100); // random number 0–99
  text += "Random number: " + randomNumber + "<br>";
  i++;
}

document.getElementById("random").innerHTML = text;
</script>

</body>
</html>
